# =============================================================================
# 로그 수집 파이프라인 로컬 검증 환경
#
#   curl -> nginx(:8000) -> api(FastAPI, N replicas) -> Kafka(KRaft)
#
# 기동:      docker compose up -d --build
# 확장 시연: docker compose up -d --scale api=3
#
# 검증: Kafka 토픽에서 로그를 직접 꺼내 도달을 확인한다.
#   docker exec log-kafka /opt/kafka/bin/kafka-console-consumer.sh \
#     --bootstrap-server localhost:9092 --topic game-logs --from-beginning
#
# 스코프 노트: 큐 이후 구간(컨슈머 -> DB 적재)은 의도적으로 제외했다.
# 과제 B안의 요구는 '큐로 받아내는 구조'에서 충족되며,
# 확장 시의 구조(수동 커밋 + event_id unique index 멱등 적재)는 README에 기술. => 이거 컨슈머랑 몽고디비 말하는거임
#
# 이 compose는 '기능 검증용'이다. Kafka RF=1, min.insync.replicas=1이며,
# 프로덕션(MSK)에서는 RF=3 + min.insync.replicas=2 + acks=all 조합이어야
# '유실 없이'가 브로커 장애까지 커버한다. (README 참고)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # nginx: 유일하게 호스트 포트를 여는 진입점.
  # api가 호스트 포트를 직접 열면 --scale 시 포트 충돌이 나므로,
  # api는 내부 네트워크에만 두고 nginx가 Docker DNS(127.0.0.11)로
  # api replica들에 라운드로빈 분배한다.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: log-nginx
    ports:
      - "8000:80"
    volumes:
      - ./api/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro #읽기 전용 설정
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # api: 로그 수집 게이트웨이 (1 Container = 1 Uvicorn, replica로 수평 확장)
  # 호스트 포트를 열지 않는다 -> --scale api=N 가능
  # ---------------------------------------------------------------------------
  api:
    build: ./api
    environment:
      APP_ENV: local
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: game-logs
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      # /health는 Kafka Producer가 start되기 전까지 503을 반환한다.
      # -> nginx는 준비된 replica에만 트래픽을 보낸다.
      # (slim 이미지에 curl이 없으므로 파이썬 표준 라이브러리로 검사)
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)", 
        ]
      interval: 5s # 헬스체크 주기 
      timeout: 5s # 응답 대기 시간 (헬스 체크 실행 후 5초 이내에 응답이 오지 않으면 검사 실패 -> 카운트 O)
      retries: 5 # 최대 재시도 횟수
      start_period: 10s # 초기 부팅 유예 기간(컨테이너가 켜지고 나서 처음 10초동안은 헬스체크가 실패해도 카운트 X)
    restart: unless-stopped # 재시작 정책

  # ---------------------------------------------------------------------------
  # kafka: KRaft 단일 노드 (ZooKeeper 없음)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: log-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller 
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093 #메타데이터를 관리할 Controller 노드들의 목록이다.(노드ID@주소:포트)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- 단일 노드 필수 설정 ---
      # 내부 토픽(__consumer_offsets 등)의 기본 RF가 3이라,
      # 아래 두 값을 1로 내리지 않으면 단일 노드에서 컨슈머 그룹이 뜨지 않는다.
      # (검증용 kafka-console-consumer도 컨슈머 그룹을 사용한다)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽은 kafka-init이 명시적으로 생성한다 (파티션 수 통제)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 데이터 디렉토리를 named volume에 고정
      # -> '컨테이너 재시작 시에도 유실되지 않도록' 요구 충족
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # 브로커가 API 요청에 실제로 응답하는지 확인 (프로세스 생존 여부가 아니라)
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # kafka-init: 토픽을 '명시적으로' 생성하고 종료하는 1회성 컨테이너.
  # auto-create에 맡기면 파티션 1개짜리 토픽이 생긴다.
  # 파티션 3개 = user_id 키 해싱으로 유저별 순서를 보장하면서,
  # 추후 컨슈머를 3개까지 병렬로 붙일 수 있는 구조를 미리 갖춘다.
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      [
        "/opt/kafka/bin/kafka-topics.sh",
        "--bootstrap-server",
        "kafka:9092",
        "--create",
        "--if-not-exists",
        "--topic",
        "game-logs",
        "--partitions",
        "3",
        "--replication-factor",
        "1",
      ]
    restart: "no"

# 컨테이너를 지워도(docker compose down) 데이터는 남는다.
# 데이터까지 초기화하려면: docker compose down -v
volumes:
  kafka-data: