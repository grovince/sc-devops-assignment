# =============================================================================
# 로그 수집 파이프라인 로컬 검증 환경 (Kafka 3브로커 KRaft 쿼럼)
#
#     curl -> nginx(:8000) -> api(FastAPI, N replicas) -> Kafka(3 brokers) -> consumer -> 파일 볼륨
#
# 기동:      docker compose up -d --build
# 확장 시연: docker compose up -d --scale api=3
#
# 브로커 3대 + RF=3 + min.insync.replicas=2 + acks=all 조합이므로,
# 브로커 1대가 죽어도 수집이 계속되고 2대가 죽으면 API가 503을 반환한다.
# (동일 호스트 위의 복제라 물리적 내구성이 아니라 '유실 방지 계약'을 검증하는 구성이다)
# =============================================================================

# -----------------------------------------------------------------------------
# 3개 브로커가 공유하는 설정. 노드마다 다른 값(NODE_ID, ADVERTISED_LISTENERS)만
# 각 서비스에서 덮어쓴다.
# -----------------------------------------------------------------------------
x-kafka-common: &kafka-common
  image: apache/kafka:3.9.0
  healthcheck:
    # 브로커가 API 요청에 실제로 응답하는지 확인 (프로세스 생존 여부가 아니라)
    test:
      [
        "CMD-SHELL",
        "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
      ]
    interval: 5s
    timeout: 10s
    retries: 12
    # 단일 노드보다 쿼럼 형성에 시간이 걸리므로 유예 기간을 늘린다
    start_period: 30s
  restart: unless-stopped

x-kafka-env: &kafka-env
  # 세 노드가 '같은 클러스터'로 묶이려면 CLUSTER_ID가 동일해야 한다.
  # 이미지 기본값에 의존하면 버전에 따라 노드별로 다른 ID가 생성될 수 있으므로
  # 명시적으로 고정한다. (kafka-storage.sh random-uuid로 생성한 값)
  CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

  KAFKA_PROCESS_ROLES: broker,controller

  # 메타데이터 쿼럼 구성원 전체 목록. 세 노드 모두 동일한 값을 가져야 한다.
  # (노드ID@주소:컨트롤러포트)
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

  # --- 복제 설정 ---
  # 브로커가 3대이므로 내부 토픽(__consumer_offsets 등)도 기본값 RF=3을 그대로 쓴다.
  # 단일 노드에서 1로 내려야 했던 제약이 사라진다.
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

  # 토픽 기본 복제 계수와 최소 ISR.
  # min.insync.replicas=2 + acks=all -> 리더 외 팔로워 1대 이상이 복제를 확인해야
  # 프로듀서가 성공을 받는다. 브로커 1대 장애는 견디고, 2대 장애 시 쓰기가 거부된다.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2

  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # 토픽은 kafka-init이 명시적으로 생성한다 (파티션 수 통제)
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_DIRS: /var/lib/kafka/data

services:
  # ---------------------------------------------------------------------------
  # nginx: 유일하게 호스트 포트를 여는 진입점.
  # api가 호스트 포트를 직접 열면 --scale 시 포트 충돌이 나므로,
  # api는 내부 네트워크에만 두고 nginx가 Docker DNS(127.0.0.11)로
  # api replica들에 라운드로빈 분배한다.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: log-nginx
    ports:
      - "8000:80"
    volumes:
      - ./api/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro # 읽기 전용 설정
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # api: 로그 수집 게이트웨이 (1 Container = 1 Uvicorn, replica로 수평 확장)
  # 호스트 포트를 열지 않는다 -> --scale api=N 가능
  # ---------------------------------------------------------------------------
  api:
    build: ./api
    environment:
      APP_ENV: local
      # 부트스트랩 주소를 3개 모두 준다. 한 대가 죽어도 나머지로 메타데이터를
      # 조회할 수 있어야 기동과 재연결이 성립한다.
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_TOPIC: game-logs
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      # /health는 Kafka Producer가 start되기 전까지 503을 반환한다.
      # -> nginx는 준비된 replica에만 트래픽을 보낸다.
      # (slim 이미지에 curl이 없으므로 파이썬 표준 라이브러리로 검사)
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # kafka-1 / kafka-2 / kafka-3: KRaft 쿼럼 (ZooKeeper 없음)
  # 각 노드가 broker + controller 역할을 겸한다.
  # 컨트롤러 3대는 1대 장애까지 쿼럼(과반 2)을 유지한다.
  # ---------------------------------------------------------------------------
  kafka-1:
    <<: *kafka-common
    container_name: log-kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      # 클라이언트가 접속할 주소. 노드마다 자기 서비스명을 알린다.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: log-kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    container_name: log-kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  # ---------------------------------------------------------------------------
  # kafka-init: 토픽을 '명시적으로' 생성하고 종료하는 1회성 컨테이너.
  # auto-create에 맡기면 파티션 1개짜리 토픽이 생긴다.
  #
  # 파티션 3개 = user_id 키 해싱으로 유저별 순서를 보장하면서,
  #              추후 컨슈머를 3개까지 병렬로 붙일 수 있는 구조를 미리 갖춘다.
  # RF 3      = 브로커 1대 장애까지 데이터가 남는다.
  # min.insync.replicas=2 = acks=all과 짝을 이뤄 '몇 대가 확인해야 성공인가'를 정한다.
  #   (브로커 기본값으로도 걸리지만, 이 토픽의 계약이므로 토픽 레벨에 명시한다)
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint:
      [
        "/opt/kafka/bin/kafka-topics.sh",
        "--bootstrap-server",
        "kafka-1:9092",
        "--create",
        "--if-not-exists",
        "--topic",
        "game-logs",
        "--partitions",
        "3",
        "--replication-factor",
        "3",
        "--config",
        "min.insync.replicas=2",
      ]
    restart: "no"

  # ---------------------------------------------------------------------------
  # consumer: Kafka -> 파일 싱크 (프로덕션의 Firehose -> S3에 대응)
  # ---------------------------------------------------------------------------
  consumer:
    build: ./consumer
    container_name: log-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_TOPIC: game-logs
    volumes:
      - log-data:/data/logs
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

# 컨테이너를 지워도(docker compose down) 데이터는 남는다.
# 데이터까지 초기화하려면: docker compose down -v
#
# 브로커별로 볼륨을 분리해야 한다. 하나를 공유하면 세 노드가 같은 로그 디렉토리에
# 동시에 쓰면서 메타데이터가 깨진다.
volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  log-data: