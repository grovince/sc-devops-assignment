# api replica들로의 라운드로빈 분배.
#
# 핵심: upstream 블록에 IP를 박아두는 대신 Docker 내장 DNS(127.0.0.11)를
# resolver로 지정하고, proxy_pass에 '변수'를 쓴다.
# -> nginx가 요청마다 DNS를 재조회하므로, 기동 이후에
#    `docker compose up -d --scale api=3`으로 replica를 늘려도
#    nginx 재시작 없이 새 replica가 분배 대상에 포함된다.
#    (변수 없이 proxy_pass http://api:8000 으로 쓰면 기동 시점에
#     1회만 해석되어 replica 1개에만 트래픽이 간다)

server {
    listen 80;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 로그 수집기는 응답이 빨라야 정상이다.
        # 오래 걸리면 매달리지 말고 끊어서 클라이언트 재시도로 돌린다.
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}